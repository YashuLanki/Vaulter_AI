<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Tracker</title>
<style>
/* The mini term sheet's palette (slate, gold, serif headings, mono figures),
   laid out for finding things: one search, a sidebar of every group, what is coming
   up, and a full page for each site. No external fonts or scripts: the page opens
   from the team folder with no network. */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f2f1; --surface-3:#e6eae9; --ink:#1d2627; --muted:#5f6c6d; --faint:#8b9798;
  --line:#dde2e1; --slate:#394f50; --slate-ink:#ffffff; --gold:#f7c240; --gold-ink:#6b4d00; --gold-soft:#fdf3d6;
  --ok:#2f7a4f; --ok-soft:#e3f2e8; --warn:#a05f00; --warn-soft:#fcefd8; --risk:#b03a2e; --risk-soft:#f9e3e0;
  --info:#3d5f86; --info-soft:#e5ecf5; --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 14px rgba(20,30,30,.05);
  --display:Georgia,"Times New Roman",serif; --body:"Segoe UI",Helvetica,Arial,sans-serif; --mono:Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --surface:#1a2223; --surface-2:#212b2c; --surface-3:#2a3536; --ink:#e7ecea; --muted:#a3b0af; --faint:#7d8a89;
  --line:#2f3b3b; --slate:#22302f; --gold-ink:#f7c240; --gold-soft:#3a3018; --ok:#7cc79a; --ok-soft:#1c3226;
  --warn:#f0b35a; --warn-soft:#382b14; --risk:#ee8b80; --risk-soft:#3b1f1c; --info:#9bbbe0; --info-soft:#1e2a38;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1a2223; --surface-2:#212b2c; --surface-3:#2a3536; --ink:#e7ecea; --muted:#a3b0af; --faint:#7d8a89;
  --line:#2f3b3b; --slate:#22302f; --gold-ink:#f7c240; --gold-soft:#3a3018; --ok:#7cc79a; --ok-soft:#1c3226;
  --warn:#f0b35a; --warn-soft:#382b14; --risk:#ee8b80; --risk-soft:#3b1f1c; --info:#9bbbe0; --info-soft:#1e2a38;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
h1,h2,h3{margin:0} p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .nw{white-space:nowrap}
/* A missing value: said in plain words, but quietly, in the body font rather than the figures' font. */
.ng{font-family:var(--body);font-size:12px;font-weight:400;color:var(--faint);letter-spacing:0}
button{font:inherit;color:inherit}

.top{background:var(--slate);color:var(--slate-ink);border-bottom:3px solid var(--gold)}
.top .in{max-width:1400px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:grid;gap:2px;margin-right:auto}
.brand .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.brand h1{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.brand .when{font-size:12px;opacity:.8}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;padding:10px 14px 10px 36px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.12);color:#fff;font:inherit}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search input:focus{outline:none;background:var(--surface);color:var(--ink);border-color:var(--gold)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.75}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30}
.results button{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2);outline:none}
.tools{display:flex;gap:6px}
.ibtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13px}
.ibtn:hover{background:rgba(255,255,255,.1)}


.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 56px}
section.view[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:2px;align-content:start}
.kpi .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.25}
.kpi .val.txt{font-family:var(--display);font-size:19px;padding-top:5px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi .rows{display:grid;gap:3px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.kpi .rows div{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.kpi.accent{}

.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.box>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.box>header h2{font-family:var(--display);font-size:16px;font-weight:600}
.box .body{padding:10px 14px;display:grid;gap:8px}
.box .item{display:grid;gap:1px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.box .item:first-child{border-top:0}
.box .item:hover b{text-decoration:underline}
.empty{color:var(--muted);font-size:13px;padding:4px 0}


details.sec{margin-bottom:14px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-size:17px;font-weight:600}
details.sec>summary .n{font-family:var(--mono);font-size:12px;background:var(--surface-3);border-radius:999px;padding:1px 8px;color:var(--muted)}
details.sec>summary .chev{margin-left:auto;transition:transform .15s;color:var(--faint)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
th.r,td.r{text-align:right} td.r>.num,td.num{white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td .main{font-weight:600}
td .sub{font-size:12px;color:var(--muted);margin-top:1px}
.scroll{max-height:72vh;overflow:auto}
.scroll th{position:sticky;top:0;z-index:1}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)} th .arr{opacity:.6}

.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-active,.p-contract{background:var(--surface-3);color:var(--ink)}
.p-closed,.p-other{background:var(--surface-3);color:var(--muted)} .p-dead{background:var(--risk-soft);color:var(--risk)}
.track{display:flex;gap:3px;margin-top:6px}
.track i{height:4px;width:16px;border-radius:2px;background:var(--surface-3)}
.track i.on{background:var(--slate)} .track.done i.on{background:var(--faint)}
.late{color:var(--risk);font-weight:600} .soon{color:var(--ink);font-weight:600}
.pos{color:inherit} .neg{color:var(--risk)}
.terms{overflow:auto}
.terms td{min-width:180px;font-size:13px}
.terms td.k,.terms th.k{position:sticky;left:0;background:var(--surface);min-width:130px;color:var(--muted);font-weight:600;font-size:12px}
.callout{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.callout summary{cursor:pointer;font-weight:600}
ul.plain{margin:8px 0 0;padding-left:18px;display:grid;gap:5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}

/* One full page per site, over the whole dashboard, with Back in the top corner (owner, 2026-11-19).
   It replaced the side panels; the Home chart's year detail uses it too. */
.sitepage{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.sitepage[hidden]{display:none}
.sp-top{position:sticky;top:0;z-index:2;background:var(--slate);color:#fff;border-bottom:3px solid var(--gold)}
.sp-top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center}
.back{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600}
.back:hover,.back:focus-visible{background:rgba(255,255,255,.12);outline:none}
.sp-top .crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.sp-body{max-width:1180px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:18px}
.sp-head h2{font-family:var(--display);font-size:30px;line-height:1.15}
.sp-head .meta{color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.sp-head .site{margin-top:0;font-size:13px}
.sp-body .kpis{margin-bottom:0}
.sp-body .kpi .val{font-size:22px}
.sp-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.sp-side{display:grid;gap:18px}
@media (max-width:900px){.sp-cols{grid-template-columns:1fr}}
.sitepage h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.sitepage .body>details{border-top:1px solid var(--line);padding-top:8px}
/* The timeline: a dot per event on one line, oldest first. Planned dates are hollow. */
.tl{list-style:none;margin:0;padding:6px 0 0}
.tl li{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:2px 14px;padding:0 0 18px 24px}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px var(--surface)}
.tl li::after{content:"";position:absolute;left:8px;top:18px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:4px} .tl li:last-child::after{display:none}
.tl li.buy::before{background:var(--s1)} .tl li.sale::before,.tl li.end::before{background:var(--s3)}
.tl li.now::before{background:var(--gold)} .tl li.plan::before{background:var(--surface);border:2px solid var(--faint)}
.tl .d{color:var(--muted);font-size:12px;padding-top:1px;white-space:nowrap}
.tl .t{font-weight:600}
.tl .x{grid-column:2 / -1;color:var(--muted);font-size:13px}
.tl .a{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.tl .chip{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--surface-3);color:var(--muted);vertical-align:1px}
@media (max-width:600px){.tl li{grid-template-columns:1fr auto}.tl .d{grid-column:1 / -1}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:0}
.kv dt,.kv dd{margin:0;padding:7px 0;border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:12px;font-weight:600;padding-right:10px}
.kv dt:first-of-type,.kv dt:first-of-type+dd{border-top:0}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.fig .lab{font-size:11px;color:var(--muted);font-weight:600}
.fig .v{font-family:var(--mono);font-size:17px;font-weight:600}
.note{font-size:12px;color:var(--muted)}
.site{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--info);text-decoration:none}
.site:hover{text-decoration:underline}
.app{max-width:1400px;margin:0 auto;padding:22px 20px 56px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:16px}
.navcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;border-top:3px solid var(--slate)}
.navcard+.navcard{border-top-color:var(--gold)}
.side .sh{font-family:var(--display);font-size:15px;color:var(--ink);font-weight:700;padding:4px 10px 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.navlist{display:grid;gap:2px}
.navlist button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink);font-size:14px}
.navlist button:hover{background:var(--surface-2)}
.navlist button[aria-current=true]{background:var(--slate);color:#fff}
.navlist button[aria-current=true] .c{background:var(--gold);color:var(--gold-ink)}
.navlist .c{min-width:30px;text-align:center;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-3);color:var(--muted);border-radius:999px;padding:1px 8px}
.navlist .all{font-weight:600}
.navlist .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hfilt{display:flex;gap:10px;align-items:center} .hfilt[hidden]{display:none}
/* Progress chart on Home. Series colours validated (dataviz checker, 2026-11-17) against the white card
   and the dark card: every hard check passes; the light aqua sits under 3:1, so the chart carries a
   legend, a tooltip and a table view. */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.prog{margin-bottom:18px}
.prog .kpis{margin-bottom:6px}
.prog .kpi{box-shadow:none;background:var(--surface-2);border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .ax{font:11px var(--body);fill:var(--muted)}
.chartwrap .grid{stroke:var(--line);stroke-width:1}
.chartwrap .hit{fill:transparent;cursor:pointer}
.chartwrap .xh{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chartwrap .tot{font:600 12px var(--body);fill:var(--ink)}
.chartwrap .tot.big{font:700 14px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:12px;min-width:200px;max-width:280px;z-index:5}
.tip b{font-family:var(--display);font-size:14px}
.tip .r{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
.tip .names{color:var(--muted);margin-top:2px}
.ptable summary{cursor:pointer;margin-top:4px}
.slide{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 14px} .slide[hidden]{display:none}
.slide label{font-size:13px;color:var(--muted);font-weight:600}
.slide input{width:240px;accent-color:var(--gold);cursor:pointer}
.slide b{min-width:118px;font-size:13px}
.main{min-width:0}
.needs{margin-bottom:18px;border-left:4px solid var(--gold)}
.needs>header h2 .c{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.needs .body{gap:0}
.needs .item{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:2px 16px;cursor:default;font-size:13px}
.needs .item b{font-weight:600}
.needs .item .q{grid-column:1 / -1}
.needs details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.needs details summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600}
.needs details .item{grid-template-columns:1fr}
@media (max-width:700px){.needs .item{grid-template-columns:1fr}}
/* The pipeline groups share one set of column widths, so they read as one list. */
table.pt{table-layout:fixed;min-width:760px}
.pt col.c-prop{width:24%} .pt col.c-who{width:17%} .pt col.c-stage{width:15%}
.pt col.c-price{width:12%} .pt col.c-date{width:15%} .pt col.c-step{width:17%}
.pt td{overflow-wrap:break-word}
.changes{margin-bottom:18px}
.changes .body{gap:0}
.ch{display:grid;grid-template-columns:92px minmax(140px,220px) 1fr;gap:4px 16px;padding:9px 0;border-top:1px solid var(--line)}
.ch:first-child{border-top:0}
.ch .when{color:var(--muted);font-size:12px;padding-top:2px}
.ch .why{color:var(--muted);font-size:13px}
.more{border:0;background:none;color:var(--info);font-weight:600;cursor:pointer;padding:8px 0 2px;text-align:left}
@media (max-width:700px){.ch{grid-template-columns:1fr}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.pair .body{max-height:260px;overflow:auto}
@media (max-width:1000px){.app{grid-template-columns:1fr}.side{position:static}.navlist{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.pair{grid-template-columns:1fr}}
@media print{.side,.top .tools,.search,.bar{display:none!important} section.view[hidden]{display:block} .scroll{max-height:none;overflow:visible} details.sec{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span class="eyebrow">Vaulter acquisitions and dispositions</span><h1>Deal Tracker</h1><span class="when" id="when"></span></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find any deal, buyer or seller" aria-label="Find any deal" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="tools">
    <button class="ibtn" id="xlsx" type="button">Open in Excel</button>
    <button class="ibtn" id="theme" type="button" aria-label="Dark or light">Dark / light</button>
  </div>
</div></header>

<div class="app">
  <!-- Deals in progress only: Past deals and the progress chart were removed (owner, 2026-11-23). -->
  <aside class="side" aria-label="Deal groups">
    <nav class="navcard" aria-label="Deals in progress"><p class="sh">Deals in progress</p><div class="navlist" id="snav-p"></div></nav>
  </aside>
  <main class="main">
    <p class="note" id="xlsxnote" hidden style="margin-bottom:12px"></p>
    <p class="note neg" id="inwarn" hidden style="margin-bottom:12px"></p>
    <section class="view" data-view="pipeline">
      <!-- One page at a time: Home, Needs a look, or the group picked in the sidebar. -->
      <div id="pneeds" hidden>
        <div class="box needs" id="needsbox" hidden><header><h2>Needs a look<span class="c" id="needn"></span></h2><span class="small muted">ask Claude to settle one; the tracker learns for next time</span></header><div class="body"><div id="needs"></div><details id="learnedwrap" hidden><summary id="learnedsum">What the tracker has learned</summary><div id="learned"></div></details></div></div>
      </div>
      <div id="phome">
        <div class="box changes"><header><h2>What changed</h2><span class="small muted" id="chn"></span></header><div class="body" id="changes"></div></div>
        <div class="pair">
          <div class="box"><header><h2>Coming up</h2><span class="small muted" id="csub"></span></header><div class="body" id="coming"></div></div>
          <div class="box"><header><h2>Open items</h2><span class="small muted" id="oin"></span></header><div class="body" id="open"></div></div>
        </div>
      </div>
      <div id="psecs" hidden></div>
    </section>
  </main>
</div>
<div class="sitepage" id="sitepage" role="dialog" aria-modal="true" aria-labelledby="sptitle" hidden>
  <div class="sp-top"><div class="in"><button class="back" id="spback" type="button" aria-label="Back to the dashboard">← Back</button><span class="crumb" id="spcrumb"></span></div></div>
  <div class="sp-body" id="spbody"></div>
</div>

<script>
/*__DATA__*/
(function(){
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // No dashes between words on the page (team rule).
  const txt = s => esc(String(s == null ? "" : s).replace(/\s[—–]\s/g, ", ").replace(/\s-\s/g, ", "));
  const NG = '<span class="ng">not given</span>';
  // A loss reads "−$1.70M" (a minus sign before the dollar), never "$-1.70M".
  const usd = (v, dp) => (v < 0 ? "−" : "") + (Math.abs(v) >= 1e6 ? `$${(Math.abs(v)/1e6).toFixed(dp)}M` : `$${Math.round(Math.abs(v)).toLocaleString("en-US")}`);
  const money = v => v == null ? NG : usd(v, 2);
  const moneyT = v => v == null ? "not given" : usd(v, 1);
  // The tracker's own sentences can carry a figure as Python wrote it ("2600000.0"); show it as a person would.
  const figs = s => txt(s).replace(/\b(\d+)\.0\b/g, (m, n) => Number(n).toLocaleString("en-US"));
  const fmtD = (iso, approx) => { if (!iso) return NG; const [y,m,d] = String(iso).split("-").map(Number);
    if (approx || !m) return `<span title="Year only">${y}</span>`;
    return new Date(y, m-1, d).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"}); };
  const today = new Date(DATA.built + "T00:00:00");
  const P = DATA.pipeline || [];
  $("#when").textContent = `Refreshed ${DATA.built_at}`;
  if (DATA.inbox_warning) { $("#inwarn").textContent = DATA.inbox_warning; $("#inwarn").hidden = false; }
  {
    const att = DATA.attention || [], les = DATA.lessons || [];
    // A deal name before ": " sits in its own column; a question with no deal spans both.
    const row = (b, rest) => `<div class="item">${b ? `<b>${txt(b)}</b><span>${figs(rest)}</span>` : `<span class="q">${figs(rest)}</span>`}</div>`;
    $("#needs").innerHTML = att.length ? att.map(a => { const c = a.indexOf(": "); return c > 0 && c < 60 ? row(a.slice(0, c), a.slice(c + 2)) : row("", a); }).join("")
      : '<p class="empty">Nothing waiting on a person.</p>';
    $("#needn").textContent = att.length || "";
    $("#learned").innerHTML = les.map(l => row("", l.lesson)).join("");
    $("#learnedsum").textContent = `What the tracker has learned (${les.length})`;
    $("#learnedwrap").hidden = !les.length;
    $("#needsbox").hidden = !att.length && !les.length;
  }

  // ── Site page ──
  // One full page over the dashboard (owner, 2026-11-19). Opening it adds a step to the browser's
  // history, so the Back button on the page, the browser's back button and Escape all return to the
  // dashboard exactly where it was; the dashboard underneath never moves.
  // Each page has a key: p-<id>, a deal in progress. The page keeps its own list of the pages
  // opened, so Back walks back through them in order whatever the browser does. It adds one step to
  // the browser's history, so the browser's back button closes the page too; a page opened from a
  // link (#p-…) adds none.
  let stack = [], pushed = false, routing = false;
  function openPage(crumb, html, key){
    $("#spcrumb").textContent = crumb; $("#spbody").innerHTML = html;
    const sp = $("#sitepage"); sp.hidden = false; sp.scrollTop = 0; document.body.style.overflow = "hidden";
    if (!routing) {
      stack.push(key);
      if (!pushed) { history.pushState({page: true}, "", "#" + key); pushed = true; }
      else history.replaceState({page: true}, "", "#" + key);
    }
    $("#spback").focus();
  }
  function hidePage(){ $("#sitepage").hidden = true; document.body.style.overflow = ""; stack = []; }
  const route = key => { const [k, id] = [key.slice(0, 2), key.slice(2)];
    routing = true;
    try { if (k === "p-") showP(id); } finally { routing = false; } };
  function goBack(){
    if ($("#sitepage").hidden) return;
    stack.pop();
    const prev = stack[stack.length - 1];
    if (prev) { route(prev); history.replaceState({page: true}, "", "#" + prev); return; }
    hidePage();
    if (pushed) { pushed = false; history.back(); }
    else history.replaceState(null, "", location.pathname + location.search);
  }
  addEventListener("popstate", () => { if (pushed) { pushed = false; hidePage(); } });
  $("#spback").onclick = goBack;
  document.addEventListener("keydown", e => { if (e.key === "Escape") { goBack(); $("#results").hidden = true; } });
  const kv = (l, v) => v == null || v === "" ? "" : `<dt>${l}</dt><dd>${v}</dd>`;
  const card = (title, inner, sub) => inner ? `<div class="box"><header><h2>${title}</h2>${sub ? `<span class="small muted">${sub}</span>` : ""}</header><div class="body">${inner}</div></div>` : "";
  const kvl = rows => rows.join("") ? `<dl class="kv">${rows.join("")}</dl>` : "";
  const tiles = l => `<div class="kpis">${l.map(([lab, val, sub]) => `<div class="kpi"><span class="lab">${lab}</span><span class="val">${val}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</div>`).join("")}</div>`;
  const srcList = s => Object.keys(s || {}).length ? `<details><summary class="small muted" style="cursor:pointer">Where each figure came from</summary><ul class="plain small">${Object.entries(s).map(([k, v]) => `<li><b>${txt(k.replace(/_/g, " "))}:</b> ${txt(v)}</li>`).join("")}</ul></details>` : "";
  // The story of a site, oldest first. Each event: {date, title, amount?, detail?, kind: buy|sale|end|now|upd, chip?}.
  // A date after today is planned: drawn hollow and labelled so.
  const KORD = {buy: 0, sale: 1, end: 2, upd: 3, now: 4};
  // The site page spells out the team's short forms (no jargon, owner 2026-11-19).
  const plain = s => String(s == null ? "" : s).replace(/\bPSA\b/g, "purchase contract").replace(/\bLOI\b/g, "offer")
    .replace(/\bDD\b/g, "due diligence").replace(/\bAPN\b/g, "parcel number").replace(/\bEMD\b/g, "earnest money")
    .replace(/\bALTA\b/g, "survey").replace(/\/\s?SF\b/g, " per square foot").replace(/\/\s?(net|gross) ac\b/g, " per $1 acre").replace(/\/\s?ac\b/g, " per acre")
    .replace(/(\d) (net |gross )?ac\b/g, "$1 $2acres");
  function timeline(ev){
    const l = ev.filter(e => e.date).sort((a, b) => String(a.date).localeCompare(String(b.date)) || KORD[a.kind] - KORD[b.kind]);
    if (!l.length) return '<p class="empty">No dated events in the record yet.</p>';
    return `<ol class="tl">${l.map(e => { const plan = e.kind !== "now" && String(e.date) > DATA.built;
      return `<li class="${plan ? "plan" : e.kind}"><span class="d">${fmtD(e.date, e.approx || String(e.date).length === 4)}</span>`
        + `<span class="t">${e.title}${plan ? '<span class="chip">planned</span>' : e.chip ? `<span class="chip">${e.chip}</span>` : ""}</span>`
        + `<span class="a">${e.amount == null ? "" : money(e.amount)}</span>${e.detail ? `<span class="x">${e.detail}</span>` : ""}</li>`; }).join("")}</ol>`;
  }
  // The tracker's own log for a site: what changed in the record and why. A sale or purchase it
  // logged is already its own event, so it is not listed twice.
  const logFor = names => (DATA.updates || []).filter(u => names.includes(u.deal) && !/^(Sold|Bought)\b/.test(u.what))
    .map(u => ({date: u.date, kind: "upd", title: "Record updated", detail: figs(u.what) + (u.why ? `. Why: ${figs(u.why)}` : "")}));

  // ── Tabs ──
  let pgroup = "";
  function mark(){ $$(".navlist button").forEach(b => b.setAttribute("aria-current", b.dataset.k === pgroup)); }
  // Sidebar entries carry no counts (owner, 2026-11-17); a gold dot only where something waits on a person.
  const navBtn = (v, k, label, o = {}) => `<button type="button" data-view="${v}" data-k="${k}"${o.home ? ' class="all"' : ""}><span>${label}</span>${o.dot ? '<span class="dot" title="Waiting on a person"></span>' : ""}</button>`;
  // Deals in progress: Home is what changed, what is coming up and open items; every other entry is its own page.
  const hasNeeds = (DATA.attention || []).length || (DATA.lessons || []).length;
  const pnav = more => { $("#snav-p").innerHTML = navBtn("pipeline", "", "Home", {home: true})
    + (hasNeeds ? navBtn("pipeline", "needs", "Needs a look", {dot: (DATA.attention || []).length > 0}) : "") + more; };
  const ppage = () => { $("#phome").hidden = pgroup !== ""; $("#pneeds").hidden = pgroup !== "needs"; $("#psecs").hidden = !pgroup || pgroup === "needs"; };
  let draw = () => { pnav(""); ppage(); mark(); };

  // ══ PIPELINE ══
  // What each stage, date and term is called on the page. The record keeps the team's own names.
  const SW = DATA.stage_words || {};
  const KW = {"Close":"Closing", "DD ends":"DD expiration", "PSA":"PSA", "Counter":"Counter", "LOI":"LOI"};
  const TW = {"Document / Date":"Latest document", "DD / Feasibility":"Due diligence", "Key Condition":"Key conditions"};
  const site = d => d.site ? `<a class="site" href="${esc(d.site.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Opens Google Earth${d.site.rough ? "; only the town is known" : ""}">${d.site.rough ? "View area" : "View site"} ↗</a>` : "";
  const ACTIVE = ["LOI Sent", "LOI Received", "Counter Sent", "PSA Negotiation", "Under Contract", "Closing Scheduled"];
  const CONTRACT = ["PSA Negotiation", "Under Contract", "Closing Scheduled"];
  const STEP = {"LOI Sent":0, "LOI Received":0, "Counter Sent":1, "PSA Negotiation":2, "Under Contract":3, "Closing Scheduled":4, "Closed":5};
  const pc = s => CONTRACT.includes(s) ? "p-contract" : ACTIVE.includes(s) ? "p-active" : s === "Closed" ? "p-closed" : ["Terminated", "Declined"].includes(s) ? "p-dead" : "p-other";
  const stage = s => s ? `<span class="pill ${pc(s)}">${esc(SW[s] || s)}</span>` : NG;
  const track = s => STEP[s] == null ? "" : `<div class="track${s === "Closed" ? " done" : ""}" title="Offer, counter offer, contract written, contract signed, closing date set, closed">${[0,1,2,3,4,5].map(i => `<i class="${i <= STEP[s] ? "on" : ""}"></i>`).join("")}</div>`;
  const pprice = d => typeof d.price === "number" ? money(d.price) : (d.price ? txt(d.price) : NG);
  const when = d => {
    if (!d.key_date) return NG;
    let rel = "";
    // Red only for a closing or due diligence date that has passed on a live deal; an LOI's date is history.
    if (d.days_out != null) rel = !d.deadline ? `<span class="faint">${-d.days_out} days ago</span>`
      : `<span class="${d.days_out < 0 ? "late" : d.days_out <= 30 ? "soon" : "muted"}">${d.days_out < 0 ? `${-d.days_out} days past` : d.days_out === 0 ? "today" : `in ${d.days_out} days`}</span>`;
    return `<div class="nw">${esc(KW[d.key_label] || d.key_label)} ${fmtD(d.key_date)}</div>${rel ? `<div class="sub">${rel}</div>` : ""}`;
  };
  const acres = v => v == null ? "" : (typeof v === "number" ? `${v.toLocaleString("en-US")} ac` : txt(v));

  if (P.length) {
    const act = P.filter(d => ACTIVE.includes(d.stage));
    const dl = act.filter(d => d.deadline && d.days_out != null);
    // The counts are in the sidebar; the one thing worth a flag here is a date that has passed.
    const late = dl.filter(d => d.days_out < 0);
    $("#csub").innerHTML = late.length ? `<span class="late">${late.length} past due</span>` : "closings and deadlines";

    const groups = [
      // A deal with no stage yet belongs only under "No stage yet", not here as well.
      ["acq", "Acquisitions", d => d.type === "Acquisition" && d.stage && !["Terminated", "Declined", "Unconfirmed"].includes(d.stage), "d-active"],
      ["dact", "Dispositions", d => d.type === "Disposition" && ACTIVE.includes(d.stage), "d-contract"],
      ["dlist", "Listed", d => d.type === "Disposition" && d.stage === "Listed", ""],
      ["dclosed", "Sold", d => d.type === "Disposition" && d.stage === "Closed", "d-closed"],
      ["unconf", "Status unconfirmed", d => d.stage === "Unconfirmed", ""],
      ["dead", "Terminated", d => ["Terminated", "Declined"].includes(d.stage), "d-dead"],
      ["other", "No stage yet", d => !d.stage, ""],
    ];
    const terms = P.filter(d => d.terms && Object.keys(d.terms).length && !["Closed", "Terminated", "Declined"].includes(d.stage));
    const TERMS = ["Document / Date", "Price", "Deposit", "DD / Feasibility", "Closing", "Key Condition", "Status"];
    const row = d => `<tr class="click" data-pid="${d.id}">
      <td><div class="main">${txt(d.property)}</div><div class="sub">${txt([d.parcel, d.location].filter(Boolean).join(" · "))}${d.acres != null ? ` · ${acres(d.acres)}` : ""}</div>${site(d)}</td>
      <td>${txt(d.counterparty) || NG}</td>
      <td>${stage(d.stage)}${track(d.stage)}</td>
      <td class="r"><div class="num">${pprice(d)}</div>${d.price_basis ? `<div class="sub" style="max-width:220px;margin-left:auto">${txt(d.price_basis)}</div>` : ""}</td>
      <td>${when(d)}</td>
      <td class="small">${d.next_step && d.next_step !== d.stage ? txt(d.next_step) : ""}</td></tr>`;
    const COLS = '<colgroup><col class="c-prop"><col class="c-who"><col class="c-stage"><col class="c-price"><col class="c-date"><col class="c-step"></colgroup>';
    draw = () => {
      const used = groups.map(([id, t, f]) => [id, t, P.filter(f)]).filter(g => g[2].length);
      pnav(used.map(([id, t]) => navBtn("pipeline", id, t)).join("") + (terms.length ? navBtn("pipeline", "terms", "Deal terms") : ""));
      ppage();
      const show = used.filter(g => g[0] === pgroup);
      $("#psecs").innerHTML = show.map(([id, t, l]) => `<details class="sec box" id="s-${id}" open><summary><h2>${t}</h2><span class="chev">›</span></summary>
        <div style="overflow:auto"><table class="pt">${COLS}<thead><tr><th>Property</th><th>${id === "acq" ? "Seller" : ["dact", "dlist", "dclosed"].includes(id) ? "Buyer" : "Buyer or seller"}</th><th>Stage</th><th class="r">Price</th><th>Next date</th><th>Next step</th></tr></thead><tbody>${l.map(row).join("")}</tbody></table></div></details>`).join("")
        + (terms.length && pgroup === "terms" ? `<details class="sec box" id="s-terms" open><summary><h2>Deal terms</h2><span class="small muted">latest document on each deal</span><span class="chev">›</span></summary>
          <div class="terms"><table><thead><tr><th class="k"></th>${terms.map(d => `<th>${txt(d.property)}</th>`).join("")}</tr></thead><tbody>${TERMS.map(t => `<tr><td class="k">${TW[t] || t}</td>${terms.map(d => `<td>${txt(d.terms[t]) || '<span class="faint">Not stated</span>'}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>` : "");
      $$("tr[data-pid]").forEach(tr => tr.onclick = () => showP(tr.dataset.pid));
      mark();
    };

    const upcoming = dl.slice().sort((a, b) => a.days_out - b.days_out);
    $("#coming").innerHTML = upcoming.length ? upcoming.map(d => `<div class="item" data-pid="${d.id}"><b>${txt(d.property)}</b><span class="small">${esc(KW[d.key_label] || d.key_label)} ${fmtD(d.key_date)} · <span class="${d.days_out < 0 ? "late" : d.days_out <= 30 ? "soon" : "muted"}">${d.days_out < 0 ? `${-d.days_out} days past` : `in ${d.days_out} days`}</span></span></div>`).join("") : '<p class="empty">No closing or study period dates set.</p>';
    $$("#coming .item").forEach(el => el.onclick = () => showP(el.dataset.pid));
  } else {
    $("#coming").innerHTML = '<p class="empty">The pipeline has not been loaded yet.</p>';
  }
  $("#snav-p").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pgroup = b.dataset.k; draw(); scrollTo(0, 0); });
  draw();
  const UP = DATA.updates || [];
  let allChanges = false;
  function drawChanges(){
    const l = allChanges ? UP : UP.slice(0, 6);
    $("#chn").textContent = UP.length ? `newest first` : "";
    $("#changes").innerHTML = UP.length ? l.map(u => `<div class="ch"><span class="when">${fmtD(u.date)}</span><b>${txt(u.deal)}</b><div><div>${txt(u.what)}</div>${u.why ? `<div class="why">Why: ${txt(u.why)}</div>` : ""}</div></div>`).join("")
      + (UP.length > 6 ? `<button class="more" id="morech" type="button">${allChanges ? "Show fewer" : `Show all ${UP.length}`}</button>` : "")
      : '<p class="empty">Nothing new yet.</p>';
    if ($("#morech")) $("#morech").onclick = () => { allChanges = !allChanges; drawChanges(); };
  }
  drawChanges();
  const oi = DATA.open_items || [];
  $("#oin").textContent = oi.length ? `${oi.length}` : "";
  $("#open").innerHTML = oi.length ? oi.map(i => { const c = i.indexOf(": "); return `<div class="item" style="cursor:default">${c > 0 ? `<b>${txt(i.slice(0, c))}</b><span class="small muted">${txt(i.slice(c + 2))}</span>` : `<span class="small">${txt(i)}</span>`}</div>`; }).join("")
 : '<p class="empty">Nothing open.</p>';

  // A deal in progress: from the original purchase (a sale) or the first offer to the closing date.
  function showP(id){
    const d = P.find(x => x.id === id); if (!d) return;
    // The land and the original purchase, from the site's own record (dashboard.py links it).
    const L = d.land || {};
    const m = v => typeof v === "number" ? money(v) : (v ? txt(v) : "");
    const buying = d.type === "Acquisition", other = txt(buying ? d.seller : d.buyer);
    const price = typeof d.price === "number" ? d.price : null;
    const ev = [
      {date: d.orig_acq_date || L.acquired, approx: !d.orig_acq_date && L.acquired_approx, kind: "buy", title: "Vaulter originally bought it", amount: d.orig_cost != null ? d.orig_cost : L.purchase_price},
      {date: d.loi_date, kind: "upd", title: buying ? "Offer made" : "Offer received", detail: other ? (buying ? `To ${other}` : `From ${other}`) : ""},
      {date: d.counter_date, kind: "upd", title: "Counteroffer"},
      {date: d.psa_date, kind: "upd", title: "Purchase contract"},
      {date: d.dd_expires, kind: "upd", title: "Due diligence ends", detail: "The buyer's period to study the property and walk away"},
      {date: d.close_date, kind: buying ? "buy" : "sale", title: "Closing", amount: price},
      ...(d.documents || []).map(x => ({date: x.filed, kind: "upd", title: "Paper received", detail: txt(x.name)})),
      ...logFor([d.property]),
      {date: DATA.built, kind: "now", title: `Today: ${txt(plain(SW[d.stage] || d.stage || "no stage yet"))}`,
       detail: [d.status ? `Where it stands: ${txt(plain(d.status))}` : "", d.next_step && d.next_step !== d.stage ? `Next: ${txt(plain(d.next_step))}` : ""].filter(Boolean).join(". ")},
    ];
    const head = `<div class="sp-head"><div class="small muted">${buying ? "Buying" : "Selling"}</div><h2 id="sptitle">${txt(d.property)}</h2>
      <div class="meta">${d.stage ? `<span class="pill ${pc(d.stage)}">${txt(plain(SW[d.stage] || d.stage))}</span>` : NG}<span>${txt([d.location, d.acres != null ? acres(d.acres) : ""].filter(Boolean).join(" · "))}</span>${site(d)}</div></div>`;
    const figsRow = tiles([["Price", typeof d.price === "number" ? money(d.price) : d.price ? txt(plain(d.price)) : NG, txt(plain(d.price_basis))], ["Earnest money", m(d.deposit) || NG],
      [{"Close": "Closing", "DD ends": "Due diligence ends", "PSA": "Purchase contract", "Counter": "Counteroffer", "LOI": "Offer"}[d.key_label] || "Next date", d.key_date ? fmtD(d.key_date) : NG, d.days_out != null ? (d.days_out < 0 ? `${-d.days_out} days ago` : d.days_out === 0 ? "today" : `in ${d.days_out} days`) : ""],
      ["Acres", d.acres != null ? txt(d.acres) : NG]]);
    const deal = kvl([kv(buying ? "Seller" : "Buyer", other), kv(buying ? "Buyer" : "Seller", txt(buying ? d.buyer : d.seller)), kv("How the price is set", txt(plain(d.price_basis))),
      kv("Parcel or lot", txt(d.parcel)), kv("Parcel numbers", txt(d.apn)), kv("Where", txt([d.city, d.county && d.county + " County", d.state].filter(Boolean).join(", "))),
      kv("Broker", txt(d.broker)), kv("Title company", txt(d.escrow)), kv("Last updated", d.updated ? fmtD(d.updated) : ""),
      kv("Papers are in", (d.folders || []).length ? d.folders.map(f => `<div class="small">${txt(f)}</div>`).join("") : "")]);
    // The whole site, which can be more than this deal covers (a sale of some of its lots).
    // The old spreadsheet's short codes, spelled out where their meaning is certain; any other is shown as written.
    const LAND = {"Res": "Residential", "SF": "Single family homes", "MF": "Multifamily", "MU": "Mixed use", "MPC": "Master planned community",
                  "C": "Commercial", "I": "Industrial", "Apt": "Apartments", "HD Res": "High density residential"};
    const landType = t => String(t || "").split("/").map(x => LAND[x.trim()] || x.trim()).join(", ");
    const land = kvl([kv("Kind of land", txt(landType(L.type))), kv("Size", txt(L.size)), kv("Cross streets", txt(L.cross_streets)),
      kv("Parcel numbers", d.apn ? "" : txt(L.apn)), kv("Zoning", txt(L.zoning)), kv("Homes per acre", txt(L.density)),
      kv("Lots", L.lots == null || /lot/i.test(L.size || "") ? "" : txt(L.lots)), kv("Lot sizes", txt(L.lot_sizes))]);
    const orig = kvl([kv("Bought", d.orig_acq_date ? fmtD(d.orig_acq_date) : L.acquired ? fmtD(L.acquired, L.acquired_approx) : ""),
      kv("Cost when bought", d.orig_cost != null ? m(d.orig_cost) : L.purchase_price != null ? m(L.purchase_price) : ""),
      kv("Profit before costs", d.gross_profit != null ? m(d.gross_profit) : ""),
      kv("Money back for each $1", d.gross_multiple != null ? `$${Number(d.gross_multiple).toFixed(2)}` : ""),
      kv("Yearly return before costs", d.gross_irr != null ? `${(d.gross_irr * 100).toFixed(1)}%` : "")]);
    const terms = Object.keys(d.terms || {}).length ? kvl(Object.entries(d.terms).map(([a, b]) => kv(txt(plain(TW[a] || a)), txt(plain(b))))) : "";
    openPage("Deals in progress", head + figsRow + `<div class="sp-cols"><div>${card("What happened", timeline(ev), "oldest first")}</div>
      <div class="sp-side">${card("The deal", deal)}${card("The whole site", land, "from the site's record")}${card("Original purchase", orig)}${card("Deal terms", terms, "latest paper")}${srcList(d.sources)}</div></div>`, "p-" + d.id);
  }

  // ── Search ──
  const index = P.map(d => ({id:d.id, name:d.property, sub:[d.type, d.counterparty, d.stage].filter(Boolean).join(" · "), hay:[d.property, d.parcel, d.buyer, d.seller, d.city, d.county].join(" ")}));
  const res = $("#results");
  $("#q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    if (q.length < 2) { res.hidden = true; return; }
    const hits = index.filter(x => x.hay.toLowerCase().includes(q)).slice(0, 14);
    res.innerHTML = hits.length ? hits.map(x => `<button type="button" data-id="${x.id}"><span><b>${txt(x.name)}</b><div class="sub small muted">${txt(x.sub)}</div></span></button>`).join("") : '<p class="empty" style="padding:10px 12px">No deal matches.</p>';
    res.hidden = false;
    $$("#results button").forEach(b => b.onclick = () => { res.hidden = true; showP(b.dataset.id); });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });

  // Opens the REAL file beside this page in Excel (Excel's own link type), not a
  // downloaded copy, so what is saved there comes back into the tracker. The
  // SharePoint address first: Excel asks whether to trust a folder on this
  // computer, never a SharePoint one. The file beside the page if there is none.
  $("#xlsx").onclick = () => {
    const file = DATA.book_url || location.href.split("#")[0].replace(/\.html?(\?.*)?$/i, ".xlsx");
    const n = $("#xlsxnote"); n.hidden = false;
    n.innerHTML = "Opening <b>Deal Tracker.xlsx</b> in Excel. If nothing opens, open it from the same folder as this page. Edits you save there come back into this page the next time the tracker is opened through Claude.";
    window.location.href = "ms-excel:ofe|u|" + file;
  };
  $("#theme").onclick = () => { const r = document.documentElement; const next = r.getAttribute("data-theme") === "dark" ? "light" : "dark"; r.setAttribute("data-theme", next); try { localStorage.setItem("dt-theme", next); } catch (e) {} };
  try { const t = localStorage.getItem("dt-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}

  // A page link (#p-<id>) opens that page over the dashboard; Back returns to it.
  const k0 = location.hash.slice(1);
  if (/^p-/.test(k0)) { route(k0); if (!$("#sitepage").hidden) stack = [k0]; }

  window.__dt = {pipeline: P.length, open: route};   // open: lets the browser test open any page
})();
</script>
</body>
</html>
